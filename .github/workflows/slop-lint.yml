name: slop-lint (report-only)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: slop-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slop-lint:
    name: slop-lint (report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Report-only: findings and a missing baseline never fail this job. A
      # human decides later whether the check becomes required.
      - name: Run slop-lint against the baseline (report-only)
        continue-on-error: true
        env:
          PYTHONPATH: tools/slop-lint
        run: python3 -m slop_lint check . --baseline slop-baseline.json --report-only | tee "$RUNNER_TEMP/slop.txt"
      - name: Append the report to the job summary
        if: always()
        run: |
          {
            echo "## slop-lint (report-only)"
            echo
            if [ -s "$RUNNER_TEMP/slop.txt" ]; then
              echo '```'
              cat "$RUNNER_TEMP/slop.txt"
              echo '```'
            fi
            if [ ! -f slop-baseline.json ]; then
              echo
              echo "No baseline exists yet: \`slop-baseline.json\` is absent. This job is report-only and does not fail."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
