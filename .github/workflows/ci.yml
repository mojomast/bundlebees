name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (sandbox included)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Allow unprivileged user namespaces for bwrap
        # Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor, which makes bwrap fail its probe. Lift the restriction for
        # this disposable runner so the real-isolation tests run instead of
        # skipping. If it stays blocked, those tests skip with a reason.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8,<9" "pyyaml>=6,<7" "ruamel.yaml>=0.18,<0.19" \
            "tiktoken>=0.7,<1" "fastapi>=0.110,<1" "httpx>=0.27,<1"
      - name: Report sandbox backend
        run: |
          python -c "from bundlebees_plugin import sandbox; print('auto backend:', sandbox.detect_backend())"
      - name: Run test suite
        run: python -m pytest -rs
      - name: Measure tool-schema tokens
        run: python scripts/measure_schemas.py

  plugin-doctor:
    name: hermes plugins doctor (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Hermes Agent (pinned, editable checkout)
        # Hermes refuses wheel/sdist builds; an editable install of a pinned
        # tag is its supported developer path.
        run: |
          python -m pip install --upgrade pip
          git clone -q --depth 1 --branch v0.23.0 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m pip install -e "$RUNNER_TEMP/hermes-agent"
      - name: Plugin doctor
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          hermes plugins doctor .

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner
