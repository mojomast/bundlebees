name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (sandbox included)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Allow unprivileged user namespaces for bwrap
        # Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor, which makes bwrap fail its probe. Lift the restriction for
        # this disposable runner so the real-isolation tests run instead of
        # skipping. If it stays blocked, those tests skip with a reason.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install test dependencies (declared in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/requirements-dev.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-dev.txt"
      - name: Report sandbox backend
        run: |
          python -c "from bundlebees_plugin import sandbox; print('auto backend:', sandbox.detect_backend())"
      - name: Check out hyvv provisioning contract (pinned)
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mojomast/hyvv.git "$RUNNER_TEMP/hyvv-contract"
          git -C "$RUNNER_TEMP/hyvv-contract" fetch --quiet origin refs/pull/4/head
          git -C "$RUNNER_TEMP/hyvv-contract" checkout --quiet eb057c7219c13016946e20957dff5c9909acf96b
          test "$(git -C "$RUNNER_TEMP/hyvv-contract" rev-parse HEAD)" = "eb057c7219c13016946e20957dff5c9909acf96b"
          echo "HYVV_SRC=$RUNNER_TEMP/hyvv-contract" >> "$GITHUB_ENV"
          echo "REQUIRE_HYVV=1" >> "$GITHUB_ENV"
      - name: Run test suite
        run: python -m pytest -rs
      - name: Measure tool-schema tokens
        run: python scripts/measure_schemas.py

  orbit-roundtrip:
    name: orbit round trip (real Orbit API, required)
    # The real cross-repo round trip: the actual Orbit /api/local-workers route from a pinned
    # mojomast/orbitdesktop commit, bundlebees dispatch, capability-bound artifact retrieval,
    # impersonation and oversized-ingestion refusals, and a signed GREEN in bubblewrap.
    # BUNDLEBEES_REQUIRE_ROUNDTRIP=1 turns a missing prerequisite into a failure, not a skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORBIT_REF: d7cf47afd8c0dec34aa42e2a40b408ad8128f3ca  # orbitdesktop feat/worker-artifact-api (OA2)
      ORBIT_ACDD_REF: 60f0ca07f6529b7d7f235e14e1d244a3dd62f523  # orbitdesktop feat/acdd-evidence-view (#26, HMAC verifier)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mojomast/orbitdesktop
          ref: ${{ env.ORBIT_REF }}
          path: .orbit-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mojomast/orbitdesktop
          ref: ${{ env.ORBIT_ACDD_REF }}
          path: .orbit-acdd-src
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install test dependencies (declared in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/requirements-dev.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-dev.txt"
      - name: Real Orbit round trip
        env:
          BUNDLEBEES_REQUIRE_ROUNDTRIP: "1"
        run: |
          ORBIT_SRC="$GITHUB_WORKSPACE/.orbit-src" ORBIT_ACDD_SRC="$GITHUB_WORKSPACE/.orbit-acdd-src" \
            python -m pytest -rA -p no:cacheprovider \
            tests/test_orbit_roundtrip.py tests/test_orbit_artifact.py tests/test_signed_report.py

  plugin-doctor:
    name: hermes plugins doctor (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Hermes Agent v0.23.0 from its lockfile
        # Hermes refuses wheel builds and pins its runtime deps in uv.lock, so
        # use a frozen uv sync of the pinned tag (its supported dev path).
        run: |
          python -m pip install "uv==0.13.1"
          git clone -q --depth 1 --branch v0.23.0 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent"
          uv sync --frozen --no-dev --python 3.14
      - name: Install bundlebees runtime dependencies into the Hermes environment
        run: |
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies']))" > "$RUNNER_TEMP/runtime-requirements.txt"
          cat "$RUNNER_TEMP/runtime-requirements.txt"
          python -m uv pip install --python "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -r "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Plugin doctor (fails closed on registration errors)
        # The doctor prints a registration error and exits 0, so its exit status
        # is not a gate. Assert the output instead: no ERROR line, and exactly
        # EXPECTED_TOOLS tools registered.
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          EXPECTED_TOOLS: "4"
        run: |
          mkdir -p "$HERMES_HOME"
          HERMES_BIN="$RUNNER_TEMP/hermes-agent/.venv/bin/hermes"
          set +e
          output=$("$HERMES_BIN" plugins doctor . 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/plugin-doctor.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::hermes plugins doctor exited $rc"
            exit 1
          fi
          if printf '%s\n' "$output" | grep -q "ERROR"; then
            echo "::error::plugin doctor reported a registration error"
            exit 1
          fi
          tools=$(printf '%s\n' "$output" | sed -nE 's/.*registrations: ([0-9]+) tool\(s\), ([0-9]+) hook\(s\).*/\1/p' | tail -1)
          if [ "${tools:-}" != "$EXPECTED_TOOLS" ]; then
            echo "::error::expected $EXPECTED_TOOLS registered tool(s), got '${tools:-none}'"
            exit 1
          fi
          echo "plugin doctor registered $tools tool(s)"

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner
