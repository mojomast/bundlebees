name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` re-evaluate the owner-held hold: adding the label
    # fails the required ci-gate check, removing it lets the pull request pass.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Merge-queue candidates run the same required checks; the owner-held job
  # resolves the queued pull request from the merge group head SHA.
  merge_group:

permissions:
  contents: read

# A newer push to the same ref supersedes any in-flight matrix for that ref,
# so duplicate matrices never run concurrently (they would burn runner time and
# report stale results). Runs on main are never cancelled, because they back the
# required checks that branch protection gates merges on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    # Four shards of the same suite run in parallel (bundlebees CI speed-up, owner yes t1659s8401).
    # .github/scripts/shard_tests.py partitions every collectable test file, and each shard re-checks
    # that partition, so no test is skipped. ci-gate needs `tests`, which fails if any shard fails.
    name: tests (sandbox included) (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Allow unprivileged user namespaces for bwrap
        # Ubuntu 24.04 runners restrict unprivileged user namespaces through
        # AppArmor, which makes bwrap fail its probe. Lift the restriction for
        # this disposable runner so the real-isolation tests run instead of
        # skipping. If it stays blocked, those tests skip with a reason.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install test dependencies (declared in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/requirements-dev.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-dev.txt"
      - name: Report sandbox backend
        run: |
          python -c "from bundlebees_plugin import sandbox; print('auto backend:', sandbox.detect_backend())"
      - name: Install gitleaks (verification requires a real scanner)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          "$RUNNER_TEMP/bin/gitleaks" version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "GITLEAKS=$RUNNER_TEMP/bin/gitleaks" >> "$GITHUB_ENV"
      - name: Check out workflow protocol (pinned)
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mojomast/workflow.git "$RUNNER_TEMP/workflow"
          git -C "$RUNNER_TEMP/workflow" fetch --quiet origin refs/heads/main
          git -C "$RUNNER_TEMP/workflow" checkout --quiet ae9c080262ab593e7643e2fba79cd51a018f25df
          test "$(git -C "$RUNNER_TEMP/workflow" rev-parse HEAD)" = "ae9c080262ab593e7643e2fba79cd51a018f25df"
          echo "WORKFLOW_SRC=$RUNNER_TEMP/workflow" >> "$GITHUB_ENV"
          echo "REQUIRE_WORKFLOW=1" >> "$GITHUB_ENV"
      - name: Check out hyvv provisioning contract (pinned)
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mojomast/hyvv.git "$RUNNER_TEMP/hyvv-contract"
          git -C "$RUNNER_TEMP/hyvv-contract" fetch --quiet origin refs/heads/main
          git -C "$RUNNER_TEMP/hyvv-contract" checkout --quiet ae8680a4c0289ce91dab52169eff1433cb694533
          test "$(git -C "$RUNNER_TEMP/hyvv-contract" rev-parse HEAD)" = "ae8680a4c0289ce91dab52169eff1433cb694533"
          echo "HYVV_SRC=$RUNNER_TEMP/hyvv-contract" >> "$GITHUB_ENV"
          echo "REQUIRE_HYVV=1" >> "$GITHUB_ENV"
      - name: Run test suite (shard ${{ matrix.shard }} of 4)
        run: |
          set -euo pipefail
          python .github/scripts/shard_tests.py --check 4 --against-pytest
          mapfile -t files < <(python3 .github/scripts/shard_tests.py ${{ matrix.shard }} 4)
          test "${#files[@]}" -gt 0
          python -m pytest -rs "${files[@]}"
      - name: Measure tool-schema tokens
        if: ${{ matrix.shard == 1 }}
        run: python scripts/measure_schemas.py

  orbit-roundtrip:
    name: orbit round trip (real Orbit API, required)
    # The real cross-repo round trip: the actual Orbit /api/local-workers route from a pinned
    # mojomast/orbitdesktop commit, bundlebees dispatch, capability-bound artifact retrieval,
    # impersonation and oversized-ingestion refusals, and a signed GREEN in bubblewrap.
    # BUNDLEBEES_REQUIRE_ROUNDTRIP=1 turns a missing prerequisite into a failure, not a skip.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ORBIT_REF: d7cf47afd8c0dec34aa42e2a40b408ad8128f3ca  # orbitdesktop feat/worker-artifact-api (OA2)
      ORBIT_ACDD_REF: 60f0ca07f6529b7d7f235e14e1d244a3dd62f523  # orbitdesktop feat/acdd-evidence-view (#26, HMAC verifier)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mojomast/orbitdesktop
          ref: ${{ env.ORBIT_REF }}
          path: .orbit-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mojomast/orbitdesktop
          ref: ${{ env.ORBIT_ACDD_REF }}
          path: .orbit-acdd-src
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: Install test dependencies (declared in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))" > "$RUNNER_TEMP/requirements-dev.txt"
          python -m pip install -r "$RUNNER_TEMP/requirements-dev.txt"
      - name: Real Orbit round trip
        env:
          BUNDLEBEES_REQUIRE_ROUNDTRIP: "1"
        run: |
          ORBIT_SRC="$GITHUB_WORKSPACE/.orbit-src" ORBIT_ACDD_SRC="$GITHUB_WORKSPACE/.orbit-acdd-src" \
            python -m pytest -rA -p no:cacheprovider \
            tests/test_orbit_roundtrip.py tests/test_orbit_artifact.py tests/test_signed_report.py

  plugin-doctor:
    name: hermes plugins doctor (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Hermes Agent v0.23.0 from its lockfile
        # Hermes refuses wheel builds and pins its runtime deps in uv.lock, so
        # use a frozen uv sync of the pinned tag (its supported dev path).
        run: |
          python -m pip install "uv==0.13.1"
          git clone -q --depth 1 --branch v0.23.0 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          cd "$RUNNER_TEMP/hermes-agent"
          uv sync --frozen --no-dev --python 3.14
      - name: Install bundlebees runtime dependencies into the Hermes environment
        run: |
          python -c "import tomllib, pathlib; d = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print('\n'.join(d['project']['dependencies']))" > "$RUNNER_TEMP/runtime-requirements.txt"
          cat "$RUNNER_TEMP/runtime-requirements.txt"
          python -m uv pip install --python "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -r "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Plugin doctor (fails closed on registration errors)
        # The doctor prints a registration error and exits 0, so its exit status
        # is not a gate. Assert the output instead: no ERROR line, and exactly
        # EXPECTED_TOOLS tools registered.
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
          EXPECTED_TOOLS: "6"
        run: |
          mkdir -p "$HERMES_HOME"
          HERMES_BIN="$RUNNER_TEMP/hermes-agent/.venv/bin/hermes"
          set +e
          output=$("$HERMES_BIN" plugins doctor . 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$output" | tee "$RUNNER_TEMP/plugin-doctor.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::hermes plugins doctor exited $rc"
            exit 1
          fi
          if printf '%s\n' "$output" | grep -q "ERROR"; then
            echo "::error::plugin doctor reported a registration error"
            exit 1
          fi
          tools=$(printf '%s\n' "$output" | sed -nE 's/.*registrations: ([0-9]+) tool\(s\), ([0-9]+) hook\(s\).*/\1/p' | tail -1)
          if [ "${tools:-}" != "$EXPECTED_TOOLS" ]; then
            echo "::error::expected $EXPECTED_TOOLS registered tool(s), got '${tools:-none}'"
            exit 1
          fi
          echo "plugin doctor registered $tools tool(s)"

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --no-banner

  owner-held:
    name: owner-held
    # Enforced through ci-gate, the single required check, so no ruleset change
    # is needed: a pull request labelled `owner-held` fails this job and ci-gate
    # (which needs it) cannot pass.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report labels and enforce the owner-held hold
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/owner_held.py "$GITHUB_EVENT_PATH"

  lease-tamper:
    name: lease-tamper
    # Required through ci-gate. Every pull request must resolve a slice
    # contract; after the verify boundary only scope.assigned_files may change
    # and scope.test_files/scope.prohibited are frozen. Applies to every
    # author, including the coordinator and triage lanes. Canonical script and
    # docs: mojomast/workflow .github/scripts/lease_tamper.py and
    # docs/32-lease-tamper-gate.md.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Enforce the slice lease and frozen tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/lease_tamper.py "$GITHUB_EVENT_PATH"

  ci-gate:
    name: ci-gate
    # The main ruleset requires this one check. It passes only when every job
    # in this file succeeded, so new jobs must be added to needs (checked below).
    if: ${{ always() }}
    needs:
      - tests
      - orbit-roundtrip
      - plugin-doctor
      - secret-scan
      - owner-held
      - lease-tamper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ci-gate needs every job in this file
        run: python3 .github/scripts/check_ci_gate.py .github/workflows/ci.yml
      - name: Fail unless every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = {job: data["result"] for job, data in json.loads(os.environ["NEEDS"]).items()}
          for job, result in sorted(results.items()):
              print(f"{job}: {result}")
          failed = sorted(job for job, result in results.items() if result != "success")
          if failed or not results:
              print("ci-gate FAILED: " + (", ".join(failed) or "no jobs"))
              sys.exit(1)
          PY
