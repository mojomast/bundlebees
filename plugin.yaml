# Native Hermes plugin manifest (v2). Quote version. Keep provides_* in sync with register().
name: bundlebees
version: "0.2.0"
description: >-
  Orchestrate CUA bees from Hermes: check launcher health, dispatch leased
  briefs, watch attempts, and generate a paste-ready host setup prompt.
  Disclosure — talks to a local or user-configured worker launcher (loopback
  by default; a private or LAN launcher URL requires allow_private=true in
  plugin settings); dispatching a bee can spend model budget on that worker
  machine; secrets are read only through Hermes get_secret; the user-run CLI
  (hermes bundlebees verify / deploy) can push a feature branch and, when you
  invoke it, reach a remote host. Cancelling or reviewing an attempt asks
  for Hermes approval first. A Cua sandbox is not a sandbox for the Hermes
  process. verify and integrate run worker-produced tests in a disposable
  bubblewrap or firejail sandbox with no network and no coordinator
  credentials (unshare only with an explicit unsafe override), and refuse to run when none is available unless
  verify_allow_unsafe_local is set. The Desktop pane never shows tokens or
  host addresses.
author: mojomast
license: MIT
homepage: https://github.com/mojomast/bundlebees
tags:
  - automation
  - tools
  - desktop
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
provides_tools:
  - bundlebees_status
  - bundlebees_dispatch
  - bundlebees_attempt
  - bundlebees_host_prompt
provides_hooks:
  - pre_tool_call
requires_env:
  - name: BUNDLEBEES_LAUNCHER_TOKEN
    description: >-
      API token for the local Orbit workers adapter or the worker launcher.
      Configure it in Hermes secrets. Never paste the value into chat.
    secret: true
config_schema:
  adapter:
    type: str
    default: orbit-loopback
    description: >-
      Worker backend: orbit-loopback (default) or launcher. opencode and codex
      are documented stubs (docs/ADAPTERS.md). The pane never displays the URL.
  launcher_url:
    type: str
    default: ""
    description: >-
      Launcher endpoint used when adapter is launcher. Never a tool argument.
      The pane never displays the URL. Loopback is allowed; private or LAN
      addresses also require allow_private.
  allow_private:
    type: bool
    default: false
    description: >-
      Opt in to a private or LAN launcher URL. Default is false. Metadata
      and link-local addresses are never allowed. Ignored for the
      orbit-loopback adapter, which is loopback-only.
  orbit_url:
    type: str
    default: "http://127.0.0.1:4318"
    description: >-
      Loopback Orbit adapter URL. Private non-loopback addresses are
      rejected. The pane never displays the URL.
  worktree:
    type: str
    default: ""
    description: >-
      Default clean git worktree for the user-run hermes bundlebees verify
      command. Not used as a model tool argument.
  branch:
    type: str
    default: ""
    description: >-
      Default feature branch for hermes bundlebees verify. main and master
      are refused.
  deploy_host_alias:
    type: str
    default: ""
    description: >-
      Stored SSH host alias for the user-run hermes bundlebees deploy
      --execute command. Not a hostname field for tools, and never shown
      in the pane.
  verify_isolation:
    type: str
    default: auto
    description: >-
      Sandbox for worker-produced code during verify and integrate: auto
      (bwrap, then firejail; never unshare), or one of bwrap, firejail,
      unshare. unshare also needs verify_allow_weak_unshare. Verify fails
      closed when none is usable.
  integrate_suite:
    type: str
    default: ""
    description: >-
      Regression suite integrate runs on the combined branch (space- or
      comma-separated test paths). Empty uses the repository's pytest
      testpaths, or the whole repository.
  integrate_security_tests:
    type: str
    default: ""
    description: >-
      Security and negative test paths integrate must also pass. Empty is
      recorded as not run. A configured path that is missing or collects
      no tests fails integration.
  integrate_base:
    type: str
    default: ""
    description: >-
      Ref the combined branch is compared with when integration fails, so
      failures that also happen there are counted as pre-existing, not
      regressions. Empty uses origin's default branch.
  verify_allow_unsafe_local:
    type: bool
    default: false
    description: >-
      UNSAFE. Allow verify/integrate to run worker tests with no isolation
      (temp copy and scrubbed env only, same user, network on) when no
      sandbox backend is available. Leave false on shared or credentialed hosts.
  verify_allow_weak_unshare:
    type: bool
    default: false
    description: >-
      UNSAFE. Permit verify_isolation=unshare, which isolates network and
      PIDs but leaves the coordinator's filesystem readable. Never picked
      by auto. Env BUNDLEBEES_ALLOW_WEAK_UNSHARE=1 does the same.
  require_contract:
    type: bool
    default: false
    description: >-
      Opt this project in to ACDD: dispatch refuses briefs without a frozen
      acdd/1 contract (contract_missing). Off by default; briefs without a
      contract then run in legacy mode with no TDD evidence required.
  verify_timeout_s:
    type: int
    default: 900
    description: Wall-clock limit in seconds for one sandboxed test run.
