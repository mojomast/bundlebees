[project]
name = "bundlebees"
version = "0.1.1"
description = "Hermes plugin for orchestrating CUA bees"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "mojomast" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pyyaml>=6,<7",
  "ruamel.yaml>=0.18,<0.19",
  "tiktoken>=0.7,<1",
  "fastapi>=0.110,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4,<5",
  "cryptography>=42,<47",
]
review = [
  "cryptography>=42,<47",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
